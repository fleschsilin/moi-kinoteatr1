name: Prepare open movie candidates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'film_research_queue.json'
      - 'scripts/prepare_movies.py'
      - '.github/workflows/prepare-movies.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'film_research_queue.json'
      - 'scripts/prepare_movies.py'
      - '.github/workflows/prepare-movies.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download and prepare official source files
        run: python scripts/prepare_movies.py --all

      - name: Upload lightweight manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-manifest
          path: prepared_manifest.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Upload prepared MP4 videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-movie-videos
          path: |
            prepared_movies/**/*.mp4
            !prepared_movies/**/original/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload original source masters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-movie-masters
          path: prepared_movies/**/original/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
