name: Prepare open movie candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download and prepare official source files
        run: python scripts/prepare_movies.py --all

      - name: Upload prepared videos and verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-open-movies
          path: |
            prepared_movies/
            prepared_manifest.json
          if-no-files-found: warn
          retention-days: 7
